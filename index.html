<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English Vocabulary Trainer</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f4f4;
}

h1,h2{
    margin-top:0;
}

.mainLayout{
    display:flex;
    min-height:100vh;
}

/* ===== MENU ===== */

.sidebar{
    width:340px;
    background:white;
    padding:20px;
    box-shadow:2px 0 8px rgba(0,0,0,0.1);
    overflow-y:auto;
}

.themeGrid{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:20px;
}

.themeItem{
    background:#f1f1f1;
    padding:8px;
    border-radius:8px;
}

.modeGroup{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:20px;
}

.playBtn{
    width:100%;
    padding:18px;
    font-size:28px;
    font-weight:bold;
    background:#00aa55;
    color:white;
    border:none;
    border-radius:14px;
    cursor:pointer;
}

.playBtn:hover{
    background:#00994d;
}

/* ===== GAME ===== */

.gameArea{
    flex:1;
    padding:20px;
}

.stats{
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
}

.topbar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

button{
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.actionBtn{
    padding:10px 16px;
    background:#333;
    color:white;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
    gap:14px;
}

.card{
    background:white;
    border-radius:10px;
    padding:12px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.word{
    width:35%;
    font-weight:bold;
}

input{
    flex:1;
    padding:10px;
    border-radius:8px;
    border:2px solid #ccc;
    font-size:15px;
}

.correct{
    background:#b9ffb9;
    border-color:green;
}

.wrong{
    background:#fff0a8;
    border-color:#d6b600;
}

.revealed{
    background:#ffb5b5;
    border-color:red;
}

.showBtn{
    background:#ff7d7d;
    color:white;
    padding:10px;
}

select{
    padding:10px;
    border-radius:8px;
    width:100%;
    font-size:16px;
}

/* ===== VICTORY ===== */

#victoryOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
    pointer-events:none;
}

#victoryText{
    font-size:90px;
    font-weight:bold;
    color:white;
    text-shadow:
        0 0 20px gold,
        0 0 40px orange;
    animation:pop 0.6s ease;
}

@keyframes pop{
    0%{
        transform:scale(0.3);
        opacity:0;
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

.confetti{
    position:fixed;
    width:12px;
    height:12px;
    top:-20px;
    animation:fall linear forwards;
    z-index:9998;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}

</style>
</head>

<body>

<div class="mainLayout">

    <!-- MENU -->
    <div class="sidebar">

        <h1>🎮 Vocab Trainer</h1>

        <h2>📚 Thèmes</h2>

        <div class="themeGrid" id="themeButtons"></div>

        <button class="actionBtn" id="allThemesBtn">
            ✅ Tous les thèmes
        </button>

        <br><br>

        <h2>🎯 Mode</h2>

        <div class="modeGroup">

            <label>
                <input type="radio" name="mode" value="en-fr" checked>
                anglais → français
            </label>

            <label>
                <input type="radio" name="mode" value="fr-en">
                français → anglais
            </label>

            <label>
                <input type="radio" name="mode" value="mix">
                mix aléatoire
            </label>

        </div>

        <h2>🔢 Nombre de mots</h2>

        <select id="wordCount">
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="20">20</option>
            <option value="all">Tous</option>
        </select>

        <br><br>

        <button class="playBtn" id="playBtn">
            ▶ PLAY
        </button>

    </div>

    <!-- GAME -->
    <div class="gameArea">

        <div class="stats">
            ✅ Trouvés :

        </div>

            <button class="actionBtn" id="revealBtn">
                👁 Tous découvrir
            </button>

        </div>

        <div class="container" id="container"></div>

    </div>

</div>

/* =========================

========================= */

const container = document.getElementById("container");

let currentWords = [];
let currentMode = "en-fr";

/* =========================
   THEMES UI
========================= */

const themeButtons = document.getElementById("themeButtons");

Object.keys(themes).forEach(theme => {

    const div = document.createElement("div");
    div.className = "themeItem";

    div.innerHTML = `
        <label>
            <input type="checkbox" class="themeCheck" value="${theme}">
            ${theme}
        </label>
    `;

    themeButtons.appendChild(div);

});

document.getElementById("allThemesBtn").addEventListener("click", () => {

    document.querySelectorAll(".themeCheck").forEach(c => {
        c.checked = true;
    });

});

/* =========================
   UTILS
========================= */

function normalize(text){

    return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();

}

function shuffleArray(array){

    for(let i = array.length - 1; i > 0; i--){

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] = [array[j], array[i]];
    }
}

function updateStats(){

    const correct =
        document.querySelectorAll(".correct").length;

    document.getElementById("correctCount").textContent =
        correct;

    const total = currentWords.length;

    if(total > 0 && correct === total){

        if(!window.victoryShown){

            window.victoryShown = true;
            launchVictory();
        }
    }

    else{

        window.victoryShown = false;
    }
}

/* =========================
   START GAME
========================= */

function startGame(){

    const selectedThemes = [];

    document.querySelectorAll(".themeCheck").forEach(c => {

        if(c.checked){
            selectedThemes.push(c.value);
        }

    });

    if(selectedThemes.length === 0){

        alert("Choisis au moins un thème !");
        return;
    }

    currentMode =
        document.querySelector('input[name="mode"]:checked').value;

    let words = [];

    selectedThemes.forEach(theme => {

        words.push(...themes[theme]);

    });

    shuffleArray(words);

    const count =
        document.getElementById("wordCount").value;

    if(count !== "all"){

        words = words.slice(0, parseInt(count));

    }

    currentWords = words;

    document.getElementById("totalCount").textContent =
        words.length;

    createCards(words);

}

/* =========================
   CREATE CARDS
========================= */

function createCards(words){

    container.innerHTML = "";

    words.forEach(word => {

        const card = document.createElement("div");
        card.className = "card";

        const left = document.createElement("div");
        left.className = "word";

        let expectedAnswers = [];
        let displayWord = "";

        if(currentMode === "en-fr"){

            displayWord = word.en;
            expectedAnswers = word.fr;

        }

        else if(currentMode === "fr-en"){

            displayWord = word.fr[0];
            expectedAnswers = [word.en];

        }

        else{

            if(Math.random() < 0.5){

                displayWord = word.en;
                expectedAnswers = word.fr;

            }

            else{

                displayWord = word.fr[0];
                expectedAnswers = [word.en];

            }
        }

        left.textContent = displayWord;

        const input = document.createElement("input");

        input.placeholder = "Traduction...";

        input.addEventListener("keydown", e => {

            if(e.key === "Enter"){

                e.preventDefault();

                const allInputs =
                    document.querySelectorAll(".card input");

                const index =
                    Array.from(allInputs).indexOf(input);

                if(index < allInputs.length - 1){

                    allInputs[index + 1].focus();

                }
            }

        });

        input.addEventListener("input", () => {

            const value = normalize(input.value);

            const valid = expectedAnswers.some(answer =>
                normalize(answer) === value
            );

            input.classList.remove(
                "correct",
                "wrong"
            );

            if(value === ""){

                updateStats();
                return;

            }

            if(valid){

                input.classList.add("correct");

            }

            else{

                input.classList.add("wrong");

            }

            updateStats();

        });

        const btn = document.createElement("button");

        btn.textContent = "👁";
        btn.className = "showBtn";

        btn.addEventListener("click", () => {

            input.value =
                expectedAnswers.join(" / ");

            input.classList.remove(
                "correct",
                "wrong"
            );

            input.classList.add("revealed");

            updateStats();

        });

        card.appendChild(left);
        card.appendChild(input);
        card.appendChild(btn);

        container.appendChild(card);

    });

    updateStats();

}

/* =========================

========================= */

function revealAll(){

    document.querySelectorAll(".card").forEach(card => {

        const input = card.querySelector("input");

        if(
            !input.classList.contains("correct") &&
            !input.classList.contains("revealed")
        ){

            input.classList.remove("wrong");

            input.classList.add("revealed");

        }

    });

}
function launchVictory(){

    const overlay =
        document.getElementById("victoryOverlay");

    overlay.style.display = "flex";

    for(let i=0; i<180; i++){

        const confetti =
            document.createElement("div");

        confetti.className = "confetti";

        confetti.style.left =
            Math.random() * 100 + "vw";

        confetti.style.background =
            `hsl(${Math.random()*360},100%,50%)`;

        confetti.style.animationDuration =
            (Math.random()*3 + 2) + "s";

        document.body.appendChild(confetti);

        setTimeout(() => {
            confetti.remove();
        }, 5000);
    }

    setTimeout(() => {
        overlay.style.display = "none";
    }, 4000);
}

            }

        });

    });
